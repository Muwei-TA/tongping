function go(page,data={}){if(!SPECS.some(s=>s.id===page))return;if(route==='publish')captureDraft(false);historyStack.push({route,currentClub,postId,articleId,eventId,authorView});route=page;if(data.club)currentClub=data.club;if(data.post)postId=data.post;if(data.article)articleId=data.article;if(data.event)eventId=data.event;if(page==='profile')authorView=data.author||null;testState='';closeModal();render();document.getElementById('screen').scrollTop=0;document.getElementById('mobileDrawer').classList.remove('open')}
function back(){if(route==='publish')captureDraft();const x=historyStack.pop();if(x)({route,currentClub,postId,articleId,eventId,authorView}=x);else route='home';closeModal();render()}
function toast(msg){const n=document.getElementById('toast');n.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.innerHTML='',3000)}
function modal(t,body,footer=''){modalPreviousFocus=document.activeElement;document.getElementById('overlay').innerHTML=`<div class="dialog-overlay" data-action="close-modal"><section class="dialog" role="dialog" aria-modal="true" aria-label="${esc(t)}" data-stop="true"><div class="dialog-handle"></div><div class="row between"><h3>${esc(t)}</h3><button data-action="close-modal" aria-label="关闭" style="font-size:25px;min-width:36px;height:36px">×</button></div>${body}<div id="modalError" class="error"></div>${footer}</section></div>`;setTimeout(()=>document.querySelector('.dialog input,.dialog textarea,.dialog button')?.focus(),0)}
function closeModal(){document.getElementById('overlay').innerHTML='';if(modalPreviousFocus?.isConnected)modalPreviousFocus.focus();modalPreviousFocus=null}
function requireAuth(){if(!logged()){go('onboarding');return false}return true}
function blocked(admin=false){return `${title(admin?'管理权限':'成员专属空间')}${empty(admin?'只有本社团负责人可以管理':'先加入，才会看到这里',admin?'切换演示社长可以体验管理。交接完成后旧社长权限失效。':'内部作品、知识和活动不对游客开放，也不会出现在公开搜索结果中。',admin?'role-admin':'nav-apply',admin?'切换演示社长':'了解并申请加入')}<div class="space"></div><p class="tiny muted">正式版必须由服务端校验权限。此 HTML 的示例数据可在源码中查看，仅演示权限交互。</p>`}
function postCard(p){if(!publicRead(p))return '';const cm=S.comments.filter(c=>c.post===p.id&&c.status==='published').length;return `<article class="card post-card"><div class="row post-author"><button data-action="author" data-owner="${p.owner}" aria-label="查看${esc(p.author)}的主页">${avatar(p.author)}</button><div class="grow"><div class="name">${esc(p.author)}</div><div class="meta">${clubName(p.club)} · ${p.time}</div></div><span class="label ${p.scope==='public'?'orange':''}">${p.scope==='public'?'公开展览':p.type}</span></div><button style="width:100%;text-align:left;padding:0" data-action="open-post" data-id="${p.id}">${p.art?art(p.art):`<div class="text-card"><div class="eyebrow">NOTES FROM OUR CLUB</div><h4>${esc(p.title)}</h4><p>让经验，成为大家共同的起点。</p></div>`}<h4>${esc(p.title)}</h4><p>${esc(p.feedback||p.body.slice(0,55))}</p></button><div class="post-footer"><span>${p.tags.map(t=>`# ${esc(t)}`).join(' &nbsp; ')}</span><div class="row" style="gap:2px"><button class="${S.likes.includes(p.id)?'liked':''}" data-action="like" data-id="${p.id}" aria-label="点赞">${icon('heart')}${p.likes+(S.likes.includes(p.id)?1:0)}</button><button data-action="open-post" data-id="${p.id}" aria-label="查看评论">${icon('comment')}${cm}</button></div></div></article>`}
function clubTile(c){const status=member(c.id)?'已加入':S.applications.find(a=>a.club===c.id&&a.user===currentUser())?.status==='pending'?'审核中':'了解社团';return `<button class="club-tile" data-action="open-club" data-id="${c.id}"><span class="club-icon" style="background:${c.color}">${c.glyph}</span><span class="grow"><h4>${c.name}</h4><p>${c.desc}</p><p>${c.tag} · 社团主页</p></span><span class="label">${status}</span></button>`}
function articleRow(a){return `<button class="knowledge-row" data-action="open-article" data-id="${a.id}"><span class="book-icon">${S.readArticles.includes(a.id)?'✓':'≡'}</span><span class="grow"><h4>${a.title}</h4><p>${a.author} · ${a.time} · ${a.topic}</p></span>${icon('chev')}</button>`}
function eventCard(e){if(!member(e.club))return '';const my=S.registrations[currentUser()+':'+e.id];return `<article class="card event-card"><button style="padding:0;width:100%;text-align:left" data-action="open-event" data-id="${e.id}"><div class="event-cover"><div class="eyebrow">CLUB SESSION / TOGETHER</div><h2>${esc(e.title)}</h2><div class="disc"></div></div><div class="row between" style="margin-top:13px"><h4>${esc(e.subtitle||'社团一起见面')}</h4><span class="label">${e.status==='cancelled'?'已取消':my&&my.status!=='cancelled'?'已报名':'可报名'}</span></div><p class="small muted" style="margin-top:5px">${e.date.slice(5).replace('-','月')}日 · ${e.time} · ${esc(e.place)}</p></button></article>`}
function menuRow(t,i,p){return `<button class="menu-row" data-action="nav" data-page="${p}">${icon(i)}<span>${t}</span>${icon('chev','chev')}</button>`}
function home(){const list=S.posts.filter(p=>publicRead(p)&&(S.feedFilter==='全部'||p.type===S.feedFilter));return `<div class="greeting"><div class="eyebrow muted">MONDAY, SEPTEMBER 21</div><h2>热爱，正在发生<span style="color:#87a351">.</span></h2><p>${S.role==='visitor'?'逛逛社团，找到与你同频的人。':`嗨，${esc(currentName())}。今天也来留下一个小小的回响。`}</p></div><button class="searchbox" data-action="nav" data-page="search">${icon('search')}搜作品、知识，或你的社团</button><div class="home-hero"><span class="label dark">${member('ani')?'本周社团邀请':'发现同频的伙伴'}</span>${star()}<h3>${member('ani')?'带上你的半成品。<br>这里，有人愿意看。':'让每一份热爱，<br>都有自己的共同空间。'}</h3><p>${member('ani')?'动画研习社 · 周五放映局 · 09.25':'先认识社团，再成为一起做事的同伴。'}</p><div class="row between hero-bottom"><span class="tiny">不完美，也值得登场。</span><button class="hero-arrow" data-action="${member('ani')?'open-event':'nav'}" data-id="e1" data-page="clubs" aria-label="查看邀请">${icon('arrow')}</button></div></div><div class="quick-grid">${[['作品','image','home-works'],['知识库','book','library'],['社团活动','calendar','events'],['轻互动','spark','playroom']].map(([t,i,a])=>`<button class="quick" data-action="${a==='home-works'?a:'nav'}" data-page="${a}"><span class="quick-icon">${icon(i)}</span>${t}</button>`).join('')}</div><div class="chips">${['全部','作品','知识','提问','闲聊'].map(t=>`<button class="pill ${S.feedFilter===t?'active':''}" data-action="feed-filter" data-value="${t}">${t}</button>`).join('')}</div>${list.map(postCard).join('')||empty('这里还没有新内容','发一份半成品，或邀请伙伴留下第一条反馈。','nav-publish','留下第一份创作')}<p class="tiny muted" style="text-align:center;margin:20px 0">你已看完当前动态。去做一点自己的创作吧 ✳</p>`}
function clubs(){return `${title('找到你的同频人')}<p class="small muted" style="margin:-7px 0 17px">南川大学 · 虚构校园 / 演示社团</p><button class="searchbox" data-action="nav" data-page="search">${icon('search')}搜索感兴趣的社团</button>${logged()?heading('我加入的'):''}<div class="stack">${logged()?CLUBS.filter(c=>member(c.id)).map(clubTile).join(''):''}</div>${heading('逛逛校园','创建社团','createclub')}<div class="chips">${['全部','创作','影像','兴趣'].map(t=>`<button class="pill ${S.clubFilter===t?'active':''}" data-action="club-filter" data-value="${t}">${t}</button>`).join('')}</div><div class="stack" style="margin-top:13px">${CLUBS.filter(c=>S.clubFilter==='全部'||c.tag===S.clubFilter).map(clubTile).join('')}</div><div class="notice" style="margin-top:17px">先了解，再加入。对外展示简介，不默认开放内部成员内容。</div>`}
function club(){const c=CLUBS.find(c=>c.id===currentClub)||CLUBS[0];return `${title('社团空间')}<div class="cover">${star()}<div class="row between"><span class="label">${c.tag} · 校内社团</span><span class="eyebrow">EST. 2024 · DEMO</span></div><h2>${c.name}</h2><p class="small">${c.desc}</p><div class="row between" style="margin-top:20px"><span class="small">${member()?c.count+' 位成员 · 演示数据':'成员确认后开放内部空间'}</span>${manager()?btn('管理','nav','secondary',{page:'admin'}):btn(member()?'邀请同伴':'申请加入','nav','secondary',{page:member()?'invite':'application'})}</div></div><div class="notice" style="margin:16px 0">${member()?'置顶 · 新成员可以先发一份半成品。不懂的地方，尽管问。':'这里的作品和经验只属于被允许参与的人。先阅读社规，再申请加入。'}</div>${!member()?empty('社内内容，仅成员可见','加入后可以查看作品、参与活动和阅读知识库。','nav-apply','申请加入'):`<div class="tabs">${['作品','知识','活动'].map(t=>`<button class="${S.clubTab===t?'active':''}" data-action="club-tab" data-value="${t}">${t}</button>`).join('')}</div>${S.clubTab==='作品'?S.posts.filter(p=>p.club===currentClub&&publicRead(p)).map(postCard).join('')||empty('第一份作品，等你来发','从一个小练习开始就很好。','nav-publish','发布作品'):S.clubTab==='知识'?`<div class="stack">${ARTICLES.filter(a=>a.club===currentClub).map(articleRow).join('')||empty('知识库正在建设','负责人可以整理授权资料与新手指引。')}</div>`:S.events.filter(e=>e.club===currentClub).map(eventCard).join('')||empty('暂时没有活动','下一次见面，从一次小邀请开始。')}`}`}
function post(){const p=currentPost();if(!p||!canRead(p))return blocked();const comments=S.comments.filter(c=>c.post===p.id&&(c.status==='published'||c.owner===currentUser()));return `${title(p.type+'详情')}<div class="row post-author"><button data-action="author" data-owner="${p.owner}" aria-label="作者主页">${avatar(p.author)}</button><div class="grow"><h4>${esc(p.author)}</h4><p class="tiny muted">${clubName(p.club)} · ${p.time}</p></div><button class="circle-btn" data-action="post-more" aria-label="作品更多操作">•••</button></div>${p.status!=='published'?`<div class="notice warn" style="margin:10px 0">${p.status==='pending'?'审核中，仅本人和审核员可见':esc((p.status==='rejected'?'退回修改：':'已下架：')+(p.reason||'请查看处理结果'))}</div>`:''}${p.art?art(p.art,true):''}<div style="margin:17px 0"><span class="label ${p.scope==='public'?'orange':''}">${p.scope==='public'?'作者授权 · 公开展览':'社团内可见'}</span><h2 style="font-size:23px;margin:12px 0">${esc(p.title)}</h2><p style="font-size:13px;color:#63735c;white-space:pre-wrap">${esc(p.body)}</p></div>${p.feedback?`<div class="feedback-box"><h4>希望听听你的想法</h4><p>${esc(p.feedback)}</p></div>`:''}<div>${p.tags.map(t=>`<span class="content-tag"># ${esc(t)}</span>`).join('')}</div><div class="actionbar">${btn(icon('heart')+(S.likes.includes(p.id)?'已赞':'赞')+' '+(p.likes+(S.likes.includes(p.id)?1:0)),'like','secondary',{id:p.id})}${btn(icon('save')+(S.saved.includes(p.id)?'已收藏':'收藏'),'save','outline',{id:p.id})}${btn(icon('share')+'分享','share','outline')}</div>${heading('一起聊聊 · '+comments.length)}${comments.map(c=>`<div class="comment"><div class="row">${avatar(c.name,'alt')}<div><div class="name">${esc(c.name)}</div><div class="meta">${c.status==='published'?'社团同伴 · 有帮助的反馈':c.status==='rejected'?'未通过：'+esc(c.reason||'请修改'):'审核中 · 仅本人可见'}</div></div></div><p>${esc(c.body)}</p>${c.status==='published'?`<button class="link" data-action="reply" data-name="${esc(c.name)}">回复</button>`:''}</div>`).join('')||'<p class="small muted">还没有反馈。先说说你看到的一个亮点。</p>'}<form id="commentForm" style="margin-top:15px"><label class="field"><span>留下一条具体的反馈</span><textarea name="comment" placeholder="我注意到……，也许可以试试……" maxlength="500"></textarea></label><div id="commentError" class="error"></div>${btn('提交反馈','submit-comment','wide')}</form><p class="tiny muted" style="margin-top:10px">评论同样经过审核；评价作品，不给作者贴标签。</p>`}
function publish(){if(!member())return blocked();const d=S.draft||{};return `${title(editingPostId?'修改后重新提交':'留下你的创作')}<p class="small muted" style="margin:-6px 0 17px">不必等到完美，半成品也值得被看见。</p><form id="publishForm"><label class="field"><span>发布类型</span><select name="type">${['作品','知识','提问','闲聊'].map(t=>`<option ${d.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field"><span>标题 <span class="muted small">最多 40 字</span></span><input name="title" placeholder="为你的作品起个名字" maxlength="40" value="${esc(d.title||'')}"></label><label class="field"><span>创作过程 / 想分享的话</span><textarea name="body" placeholder="用了什么方法？现在卡在哪里？" maxlength="2000">${esc(d.body||'')}</textarea></label><button type="button" class="upload-zone" style="width:100%;margin-bottom:15px" data-action="sample-art">${d.art?art(d.art):icon('upload')}${d.art?'已添加示例附件 · 点击移除':'添加示例作品封面'}<div class="tiny muted">原型只使用内置插画，不上传真实文件</div></button><label class="field"><span>想得到哪方面的反馈？</span><input name="feedback" placeholder="如：镜头节奏、构图、角色动作" maxlength="100" value="${esc(d.feedback||'')}"></label><label class="field"><span>发布到</span><select name="club">${CLUBS.filter(c=>member(c.id)).map(c=>`<option value="${c.id}" ${(d.club||currentClub)===c.id?'selected':''}>${c.name}</option>`).join('')}</select></label><label class="field"><span>谁可以看到？</span><select name="scope"><option value="club" ${d.scope!=='public'?'selected':''}>仅社团成员 · 默认</option><option value="public" ${d.scope==='public'?'selected':''}>公开展览 · 需额外授权</option></select></label><label class="check"><input type="checkbox" name="rights" ${d.rights?'checked':''}><span>我拥有内容权利或已获得分享授权，并遵守社规。</span></label><label class="check"><input type="checkbox" name="publicConsent" ${d.publicConsent?'checked':''}><span>若选择公开展览，我另行同意对社团外展示。仅社内发布无需勾选。</span></label><div id="publishError" class="error"></div><div class="actionbar">${btn('存为草稿','save-draft','outline')}${btn('提交审核','submit-post')}</div></form><p class="tiny muted">加入知识库不等于转让著作权。</p>`}
function myposts(){if(!logged())return blocked();const own=S.posts.filter(p=>p.owner===currentUser());return `${title('我的发布')}<div class="notice">审核不是黑箱。每份提交都能查看状态和处理原因。</div>${S.draft?`<div class="card pad" style="margin-top:16px"><span class="label orange">本地草稿</span><h4 style="margin:10px 0">${esc(S.draft.title||'尚未命名的创作')}</h4>${btn('继续编辑','nav','secondary wide',{page:'publish'})}</div>`:''}${own.map(p=>`<div class="card pad" style="margin:14px 0"><div class="row between"><span class="label ${p.status==='published'?'':'orange'}">${({pending:'待审核',published:'已发布',rejected:'退回修改',removed:'已下架'})[p.status]}</span><span class="tiny muted">${clubName(p.club)}</span></div><h4 style="margin:12px 0">${esc(p.title)}</h4>${p.reason?`<p class="small muted">原因：${esc(p.reason)}</p>`:''}<div class="actionbar">${btn(p.status==='rejected'?'修改重审':'查看详情',p.status==='rejected'?'edit-post':'open-post','secondary',{id:p.id})}${btn('删除','delete-post','outline',{id:p.id})}</div></div>`).join('')||(!S.draft?empty('第一份创作，从今天开始','发布作品、提问或者分享一个小发现。','nav-publish','写一点什么'):'')}`}
function library(){if(!member())return blocked();const all=ARTICLES.filter(a=>a.club===currentClub),items=all.filter(a=>S.libraryFilter==='全部'||a.topic===S.libraryFilter),read=all.filter(a=>S.readArticles.includes(a.id)).length;return `${title('社团知识库')}<div class="knowledge-hero"><div class="eyebrow" style="color:#89694d">OUR SHARED NOTES</div><h3>不从零开始，<br>站在彼此的经验上。</h3><p>顺着阅读路径，让加入变得更轻松。</p><div style="width:160px;margin-top:15px"><div class="progress"><span style="width:${all.length?read/all.length*100:0}%"></span></div><div class="tiny muted" style="margin-top:6px">新手路径 ${read} / ${all.length} 已读</div></div><span class="book-shape">Aa</span></div><div class="chips" style="margin:17px 0">${['全部','新手必读','创作方法','社团传承'].map(t=>`<button class="pill ${S.libraryFilter===t?'active':''}" data-action="library-filter" data-value="${t}">${t}</button>`).join('')}</div><div class="stack">${items.map(articleRow).join('')||empty('这一栏正在整理','从社团真实遇到的问题开始积累。')}</div>${heading('怎样成为社团的共同记忆？')}<div class="notice">不是把所有帖子搬进文件夹。先整理问题，再征得作者授权，最后整理成可复用的路径。</div>`}
function article(){const a=ARTICLES.find(x=>x.id===articleId);if(!a||!member(a.club))return blocked();return `${title('知识详情')}<span class="label orange">${a.topic}</span><h2 style="margin:14px 0;font-size:26px">${a.title}</h2><div class="row">${avatar(a.author)}<div><h4 style="font-size:12px">${a.author} · 维护人</h4><p class="tiny muted">${a.time} · ${a.version}</p></div></div><div class="card pad" style="margin:20px 0"><div class="eyebrow muted">这篇会讲什么</div>${a.sections.map(([h],i)=>`<button class="menu-row" style="padding:10px 0;min-height:40px;font-size:12px" data-action="anchor" data-id="section${i}"><span class="muted tiny">0${i+1}</span>${h}${icon('chev','chev')}</button>`).join('')}</div><div class="article-body">${a.sections.map(([h,b],i)=>`<section id="section${i}"><h3>${h}</h3><p>${b}</p>${i===1?'<div class="example">反馈模板：我注意到【具体细节】，让我感到【观感】，也许可以尝试【一个可执行的调整】。</div>':''}</section>`).join('')}</div><div class="notice" style="margin:18px 0">演示知识文本，用于测试阅读体验，不是学校官方教学资料。</div><div class="actionbar">${btn(icon('save')+(S.saved.includes(a.id)?'已收藏':'收藏'),'save','outline',{id:a.id})}${btn(S.readArticles.includes(a.id)?'已读完 ✓':'我读完了','article-read','',{id:a.id})}</div>${btn('还有问题？向社团提问','ask-article','secondary wide')}`}
function events(){if(!logged())return blocked();const list=S.events.filter(e=>member(e.club));return `${title('把线上，变成见面')}<p class="small muted" style="margin:-7px 0 18px">每一次共同经历，都是新的故事开场。</p><div class="row between"><span class="label purple">近期 · 已加入社团</span><button class="link" data-action="nav" data-page="ticket">我的报名 ${icon('chev')}</button></div>${list.map(eventCard).join('')||empty('暂时没有可参与的活动','先加入感兴趣的社团，等待下一次见面。')}${manager()?btn(icon('plus')+'组织一场活动','nav','wide secondary',{page:'eventedit'}):''}<p class="tiny muted" style="margin-top:15px">仅设计免费社团活动，不涉及支付和第二课堂学分。</p>`}
function event(){const e=currentEvent();if(!member(e.club))return blocked();const r=registration(),s=testState||e.status,taken=e.base+Object.entries(S.registrations).filter(([k,v])=>k.endsWith(':'+e.id)&&['registered','checked'].includes(v.status)).length;return `${title('活动详情')}<div class="event-cover"><div class="eyebrow">CREATIVE SCREENING / TOGETHER</div><h2>${esc(e.title)}</h2><p style="font-size:12px;color:#69577f;position:relative;z-index:1;margin-top:15px">${esc(e.subtitle||'一次简单、真诚的社团见面')}</p><div class="disc"></div></div><div class="row between" style="margin:18px 0"><span class="label purple">${clubName(e.club)}</span><span class="label">免费 · 社内活动</span></div>${s==='cancelled'?'<div class="notice danger">活动已取消；真实状态变更后凭证会同步失效。</div>':s==='closed'?'<div class="notice warn">报名已经截止，可关注下一期。</div>':''}<div class="event-info">${icon('calendar')}<div><strong>${e.date} ${e.time}</strong><br><span class="muted">北京时间 Asia/Shanghai</span></div></div><div class="event-info">${icon('pin')}<div>${esc(e.place)}<br><span class="muted">不用获取定位，也能查看地址</span></div></div><div class="event-info">${icon('club')}<div>${s==='full'?e.capacity:Math.min(taken,e.capacity)} / ${e.capacity} 个名额<br><span class="muted">${s==='full'?'当前满员，可以加入候补':'已有同伴，等你一起'}</span></div></div>${heading('带什么来？')}<p class="small" style="color:#62705b">${esc(e.description)}</p>${heading('先知道这些')}<p class="small muted">每人分享约 3 分钟。创作者决定是否允许拍摄。无法到场请提前取消。候补不等于报名成功；正式版按候补顺序通知递补。</p><div class="space"></div>${r&&r.status!=='cancelled'?btn(r.status==='waitlist'?'查看候补状态':'查看我的凭证','nav','wide',{page:'ticket'}):['cancelled','closed'].includes(s)?'<button class="btn wide" disabled>当前不可报名</button>':btn(s==='full'?'加入候补':'我想参加','register-open','wide')}<p class="tiny muted" style="text-align:center;margin-top:10px">不授权提醒，也可以正常报名。</p>`}
function ticket(){if(!logged())return blocked();const mine=Object.entries(S.registrations).filter(([k,v])=>k.startsWith(currentUser()+':')&&v.status!=='cancelled');const e=currentEvent(),r=registration();const picker=mine.length>1?`<div class="chips" style="margin-bottom:14px">${mine.map(([k,v])=>{const id=k.split(':')[1],ev=S.events.find(e=>e.id===id);return `<button class="pill ${id===e.id?'active':''}" data-action="ticket-select" data-id="${id}">${esc(ev?.title||'活动')}</button>`}).join('')}</div>`:'';if(!r||r.status==='cancelled')return `${title('我的报名')}${mine.length?`<div class="stack">${mine.map(([k])=>{const ev=S.events.find(e=>e.id===k.split(':')[1]);return btn(esc(ev.title),'ticket-select','outline wide',{id:ev.id})}).join('')}</div>`:empty('还没有有效报名','找一场喜欢的活动，让同频的人在线下相遇。','nav-events','去看看活动')}`;if(!member(e.club))return blocked();const state=e.status==='cancelled'?'活动已取消':({registered:'报名成功',waitlist:'候补中',checked:'已签到'})[r.status];return `${title('我的报名凭证')}${picker}<div class="ticket"><div class="ticket-top"><div class="eyebrow" style="color:#c2d4b1">YOUR NEXT GATHERING</div><h2 style="color:white;margin:13px 0">${state}</h2><span class="label dark">${clubName(e.club)}</span></div><div class="ticket-main"><h3>${esc(e.title)}</h3><p class="small muted" style="margin-top:9px">${e.date} ${e.time} · 北京时间<br>${esc(e.place)}</p><div class="ticket-sep"></div><div class="demo-code">${r.status==='waitlist'?'WAIT 01':'DEMO 026'}</div><p class="tiny muted" style="text-align:center;margin-top:10px">演示编号，不是可核销的真实二维码</p><div class="divider"></div><div class="row between"><span class="small muted">参与人</span><strong class="small">${esc(r.name)}</strong></div><div class="row between" style="margin-top:10px"><span class="small muted">活动提醒</span><span class="small">${r.reminder?'已选择 · 宿主授权未接入':'站内消息'}</span></div></div></div><div class="space"></div>${e.status==='cancelled'?'<div class="notice danger">无需签到。此凭证已失效，请勿前往。</div>':r.status==='registered'?btn('演示现场签到','checkin','wide'):r.status==='checked'?btn('写下这次活动的收获','recap','wide secondary'):'<div class="notice warn">候补不是报名成功，请等待明确的名额通知。自动递补未在本原型实现。</div>'}<div style="margin-top:10px">${e.status!=='cancelled'&&r.status!=='checked'?btn('取消报名 / 退出候补','cancel-registration','wide outline'):''}</div><p class="tiny muted" style="margin-top:15px">正式版由授权组织者核验动态凭证，不使用此演示按钮让参与者自助核销。</p>`}
function playroom(){if(!member())return blocked();const counts=[18,12,6],total=36+(S.poll!==null?1:0);return `${title('一起玩点小的')}<div class="home-hero" style="background:#756681"><div class="eyebrow" style="color:#ede1f4">LOW PRESSURE, GOOD COMPANY</div><h3 style="font-size:25px">先聊一个小话题，<br>再认识一个新朋友。</h3><p>轻互动不是排行榜，也不需要“社交满分”。</p></div>${heading('下次创作小挑战，选哪个？')}<p class="small muted">每人 1 票 · 本社团内 · 不公开个人选票</p><div style="margin-top:15px">${['用 3 种颜色画一个梦','做一段 5 秒钟的循环动画','把校园声音画成一张海报'].map((t,i)=>{const votes=counts[i]+(S.poll===i?1:0);return `<button class="poll-option ${(S.poll===i||pollDraft===i)?'selected':''}" data-action="poll-choice" data-index="${i}" ${S.poll!==null?'disabled':''}>${S.poll!==null?`<i class="meter" style="width:${votes/total*100}%"></i>`:''}<span>${S.poll===i?'✓':String(i+1).padStart(2,'0')}</span><span class="grow">${t}</span>${S.poll!==null?`<span>${Math.round(votes/total*100)}%</span>`:''}</button>`}).join('')}</div>${S.poll===null?btn('投出这一票','poll-submit','wide'):''}<p class="tiny muted" style="margin-top:10px">${S.poll!==null?'已投票，不重复计票。':''}人数为预置演示样本，不是研究统计。</p>${heading('周末找搭子')}<div class="card pad"><span class="label orange">不是陌生人匹配</span><h4 style="margin:12px 0">找一位伙伴，一起完成小作品。</h4><p class="small muted">在社内话题里介绍时间、目标和所需帮助。不自动公开联系方式，也不默认创建私聊。</p><div style="margin-top:15px">${btn('发起一个社内话题','teammate','wide secondary')}</div></div>`}
function notifications(){if(!logged())return blocked();const list=notices().filter(n=>S.noticeFilter==='全部'||n.type===S.noticeFilter);return `${title('有人回应了你')}<div class="row between"><div class="chips">${['全部','互动','事务'].map(t=>`<button class="pill ${S.noticeFilter===t?'active':''}" data-action="notice-filter" data-value="${t}">${t}</button>`).join('')}</div><button class="link" data-action="read-all">全部已读</button></div>${list.map(n=>`<button class="notification" data-action="notice-open" data-id="${n.id}"><div class="quick-icon" style="height:35px;width:35px;border-radius:11px">${icon(n.type==='互动'?'comment':'bell')}</div><div class="text"><strong>${n.type==='互动'?'新的互动':'社团事务'}</strong><br>${esc(n.title)}<div class="time">演示通知 · 点击查看</div></div>${!S.readNotices.includes(n.id)?'<span class="unread"></span>':''}</button>`).join('')||empty('暂时没有消息','与你相关的反馈、报名和审核结果会出现在这里。')}<div class="notice" style="margin-top:20px">只提醒与你相关的事。宿主未授权通知时，消息仍保留在这里。</div>`}
function profile(){if(!logged())return blocked();const other=authorView?S.posts.find(p=>p.owner===authorView&&publicRead(p)):null,name=other?.author||currentName();const own=S.posts.filter(p=>p.owner===(other?authorView:currentUser())&&publicRead(p));return `<div class="profile-cover"></div><div class="profile-identity">${avatar(name,'big')}<div class="row between" style="margin-top:5px"><h2>${esc(name)}</h2>${!other?`<button class="circle-btn" data-action="nav" data-page="settings" aria-label="隐私与设置">${icon('settings')}</button>`:''}</div><p class="small muted" style="margin:8px 0">把没来得及说的话，放进作品里。</p><span class="label">${other?clubName(other.club):member('ani')?'动画研习社':'社团'} · ${other||member('ani')?'社团成员':'待确认'}</span><p class="tiny muted" style="margin-top:8px">社团成员关系不代表学校官方认证。</p></div><div class="stats"><div><strong>${own.length}</strong><span>共享范围内作品</span></div><div><strong>${other?'—':S.readArticles.length}</strong><span>${other?'阅读记录不公开':'读过的资料'}</span></div><div><strong>${other?'—':CLUBS.filter(c=>member(c.id)).length}</strong><span>加入的社团</span></div></div>${other?own.map(postCard).join('')||empty('还没有共享的作品','只显示你有权限看到的内容。'):`<div class="card">${menuRow('我的发布','edit','myposts')}${menuRow('我的收藏','save','collection')}${menuRow('我的报名','ticket','ticket')}${menuRow('加入申请','club','application')}${manager()?menuRow('社团管理','chart','admin'):''}${menuRow('隐私与账号','settings','settings')}</div><div class="notice" style="margin-top:17px">贡献不是积分竞争。记录作品与经验，不做公开活跃排行榜。</div>`}`}
function search(){const q=searchTerm.trim().toLowerCase(),ps=q?S.posts.filter(p=>publicRead(p)&&[p.title,p.body,p.author].join(' ').toLowerCase().includes(q)):[],aa=q?ARTICLES.filter(a=>member(a.club)&&a.title.includes(q)):[],cc=q?CLUBS.filter(c=>(c.name+c.desc+c.tag).includes(q)):[],ee=q?S.events.filter(e=>member(e.club)&&e.title.includes(q)):[],count=ps.length+aa.length+cc.length+ee.length;return `${title('找到你想找的')}<form id="searchForm" class="searchform"><input name="q" value="${esc(searchTerm)}" placeholder="作品、知识、社团、活动" aria-label="搜索关键词"><button class="btn" type="submit">搜索</button></form>${q?`<p class="small muted">“${esc(searchTerm)}” · ${count} 个有权限的结果</p>${ps.length?`<div class="results-label">作品与讨论</div>${ps.map(postCard).join('')}`:''}${aa.length?`<div class="results-label">知识资料</div><div class="stack">${aa.map(articleRow).join('')}</div>`:''}${cc.length?`<div class="results-label">社团</div><div class="stack">${cc.map(clubTile).join('')}</div>`:''}${ee.length?`<div class="results-label">活动</div>${ee.map(eventCard).join('')}`:''}${!count?empty('暂时没有找到','试试更短的关键词。未加入社团的内部标题、摘要都不会出现在这里。'):''}`:`${heading('试试这些')}<div class="chips">${['森林','分镜','动画','半成品'].map(t=>`<button class="pill" data-action="search-term" data-value="${t}">${t}</button>`).join('')}</div><div class="notice" style="margin-top:20px">搜索范围：公开内容，以及你已加入社团的内容。收藏、分享不会扩大权限。</div>`}`}
function invite(){const c=CLUBS.find(c=>c.id===currentClub)||CLUBS[0];return `${title('有人邀你来同频')}<div class="invite-hero"><div class="brand-mark">≈</div><div class="eyebrow" style="color:#c1d6ae">YOU BELONG SOMEWHERE</div><h2 style="margin-top:15px">让你的热爱，<br>有一个共同空间。</h2><p>${c.name}邀请你：发布作品，交换经验，也认识一起做事的人。</p>${star()}</div>${heading('加入以后，你可以')}<div class="stack">${[['01','给半成品一个被看见的机会'],['02','不必从头寻找前辈留下的经验'],['03','围绕一次活动认识真正的同伴']].map(([i,t])=>`<div class="row"><span class="stepnum">${i}</span><p class="small">${t}</p></div>`).join('')}</div><div class="notice" style="margin:20px 0">南川大学（虚构） · ${c.name}<br>申请由负责人处理，内容默认社内可见。</div>${btn(member()?'回到我的社团':'了解规则并申请加入',member()?'nav-club':'join-start','wide')}<p class="tiny muted" style="text-align:center;margin-top:12px">有效邀请演示，不是真实入社二维码。</p>`}
function onboarding(){return `${title('先认识一下你')}<div class="status-hero" style="padding-top:15px"><div class="brand-mark" style="margin:0 auto 20px;height:58px;width:58px;font-size:40px">≈</div><h2>欢迎来到同频</h2><p>只需要一个昵称。<br>不读取你的通讯录或定位。</p></div><form id="loginForm"><label class="field"><span>社团里怎么称呼你？</span><input name="nickname" maxlength="20" placeholder="如：知夏" value="${S.role==='visitor'?'':esc(S.nickname)}"></label><label class="field"><span>感兴趣的方向 <span class="muted">可选</span></span><input name="interest" placeholder="动画、摄影、音乐……" maxlength="60"></label><label class="check"><input name="consent" type="checkbox"><span>我已阅读并同意演示服务与隐私说明。这里只创建本地演示账号。</span></label><button type="button" class="link" data-action="policy">阅读服务与隐私说明</button><div id="loginError" class="error"></div>${btn('使用 '+S.host+' 登录（演示）','login','wide')}<div style="margin-top:10px">${btn('暂不登录，看看公开介绍','nav','outline wide',{page:'invite'})}</div></form><p class="tiny muted" style="margin-top:20px">宿主登录只确认账号，不代表学籍或社团身份。正式上线需接入官方登录和独立成员审核。</p>`}
function application(){if(!logged())return `${title('申请加入')}${empty('先登录，再介绍一下自己','登录不代表自动成为社团成员。','join-start','登录并申请')}`;const a=S.applications.find(a=>a.club===currentClub&&a.user===currentUser());if(member())return `${title('加入申请')}<div class="status-hero"><div class="stamp">${icon('check')}</div><h2>已经是同伴了</h2><p>你已加入${clubName(currentClub)}。<br>可以阅读内部内容、发布作品和参加活动。</p></div>${btn('进入社团','nav-club','wide')}`;if(a?.status==='pending')return `${title('申请进度')}<div class="status-hero"><div class="stamp">${icon('clock')}</div><h2>申请已经送达</h2><p>等待${clubName(currentClub)}的负责人确认。<br>审核结果会出现在消息中心。</p></div><div class="timeline"><div class="timeline-item done">已提交申请<p>${esc(a.reason)}</p></div><div class="timeline-item">负责人审核<p>暂无确定处理时间，请勿重复提交。</p></div><div class="timeline-item">一起加入社团<p>通过后开放社内内容。</p></div></div>${btn('撤回申请','withdraw-application','wide outline')}<div class="notice" style="margin-top:16px">可切换“社长 → 成员与申请管理”，处理动画研习社的演示申请。其他社团负责人尚未模拟。</div>`;return `${title('申请加入 '+clubName(currentClub))}${a?.status==='rejected'?`<div class="notice warn" style="margin-bottom:17px">上次未通过：${esc(a.reasonReject)}。可补充信息后重新申请。</div>`:''}<p class="small muted" style="margin-bottom:18px">不需要很厉害，重要的是愿意一起尝试。</p><form id="applyForm"><label class="field"><span>想和大家一起做什么？</span><textarea name="reason" maxlength="200" placeholder="简单介绍兴趣，或想尝试的一件事。">${esc(a?.reason||'')}</textarea></label><div class="notice">社团约定：尊重创作者，不给作者贴标签；不擅自传播社内作品；遇到问题可举报。</div><label class="check"><input type="checkbox" name="rules"><span>我了解社团规则，愿意共同维护这个空间。</span></label><div id="applyError" class="error"></div>${btn('提交申请','submit-application','wide')}</form>`}

function render(){const p=SPECS.find(x=>x.id===route)||SPECS[0];document.getElementById('screen').innerHTML=`<div class="page">${PAGES[route]()}</div>`;document.getElementById('sidebar').innerHTML=sidebarHTML();document.getElementById('inspector').innerHTML=inspectorHTML();document.getElementById('bottomNav').innerHTML=[['home','home','动态'],['clubs','club','社团'],['publish','plus','发布'],['notifications','bell','消息'],['profile','user','我的']].map(([page,i,t])=>`<button class="navitem ${route===page?'active':''} ${page==='publish'?'add':''}" data-action="nav" data-page="${page}" aria-label="${t}">${icon(i)}<span>${t}</span></button>`).join('');document.getElementById('stageTitle').textContent=p.title;document.getElementById('hostTitle').textContent='同频 · '+S.host+' 入口预览';document.getElementById('roleSelect').value=S.role;document.getElementById('hostSelect').value=S.host;document.getElementById('stateBanner').innerHTML=testState?`<div class="state-banner">正在模拟：${({full:'名额已满',closed:'报名已截止',cancelled:'活动已取消'})[testState]} · 非真实活动变更</div>`:'';document.getElementById('mobileDrawer').innerHTML=`<div class="mobile-controls"><select class="select-mini" data-change="role" aria-label="演示角色">${[['member','成员'],['visitor','游客'],['admin','社长'],['successor','继任者']].map(([v,t])=>`<option value="${v}" ${S.role===v?'selected':''}>${t}</option>`).join('')}</select><select class="select-mini" data-change="host" aria-label="小程序宿主"><option ${S.host==='微信'?'selected':''}>微信</option><option ${S.host==='QQ'?'selected':''}>QQ</option></select><button data-action="mobile-menu" class="link">返回原型 ×</button></div>${sidebarHTML()}`;document.title='同频 · '+p.title+' / 交互原型'}

function stashProfile(){S.profiles=S.profiles||{};S.profiles[currentUser()]={likes:[...S.likes],saved:[...S.saved],readArticles:[...S.readArticles],draft:S.draft,readNotices:[...S.readNotices],prefs:{...S.prefs},poll:S.poll}}

document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='searchForm'){searchTerm=String(new FormData(e.target).get('q')||'').trim();render();return}const m={commentForm:'submit-comment',publishForm:'submit-post',loginForm:'login',applyForm:'submit-application',registerForm:'register-confirm',eventForm:'submit-event',createClubForm:'submit-club',handoverForm:'start-handover'};if(m[e.target.id])doAction({dataset:{action:m[e.target.id]}})});
document.addEventListener('change',e=>{if(e.target.id==='roleSelect'||e.target.dataset.change==='role'){setRole(e.target.value)}if(e.target.id==='hostSelect'||e.target.dataset.change==='host'){captureDraft(false);S.host=e.target.value;redraw();toast('只切换宿主预览；没有接入原生 SDK')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.getElementById('mobileDrawer').classList.remove('open');document.getElementById('overviewRoot').innerHTML=''}if(e.key==='Tab'&&document.querySelector('.dialog')){const ns=[...document.querySelectorAll('.dialog button,.dialog input,.dialog textarea,.dialog select,.dialog a')].filter(n=>!n.disabled);if(!ns.length)return;const first=ns[0],last=ns[ns.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('beforeunload',()=>{captureDraft(false);persist()});
window.DEMO={go,render,setRole,reset:resetDemo,getState:()=>S,specs:SPECS};
render();
const deepPage=location.hash.slice(1);if(PAGES[deepPage])go(deepPage);
